<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixQZero - Главная</title>
    <style>
        /* --- Анимации --- */
        @keyframes purpleGoldGradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseStatus {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        /* --- Переменные тем --- */
        :root {
            --bg-gradient: linear-gradient(-45deg, #8e44ad, #b48a00, #6a1b9a, #c89600);
            --btn-bg: rgba(255, 255, 255, 0.15);
            --btn-border: rgba(255, 255, 255, 0.25);
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(-45deg, #1a1a1a, #000000, #2c3e50, #000000);
            --btn-bg: rgba(0, 0, 0, 0.4);
            --btn-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: purpleGoldGradientShift 15s ease infinite;
            overflow-x: hidden;
            color: #f0f0f0;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.8s ease;
        }

        body.static-bg { animation: none !important; background-size: cover; }

        /* --- Настройки --- */
        .settings-trigger {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            z-index: 1100;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: 0.3s;
            min-width: 44px;
            min-height: 44px;
        }

        .settings-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(25px);
            z-index: 1050;
            transform: translateX(-101%);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 80px 25px 40px;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 0 50px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .settings-panel.active { transform: translateX(0); }

        .setting-item { margin-bottom: 25px; display: flex; flex-direction: column; gap: 10px; }
        .setting-item label { font-size: 12px; color: #f1c40f; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.8; }
        
        .switch-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }
        .switch-btn.active { background: #f1c40f; color: #000; font-weight: bold; border-color: #f1c40f; }

        /* --- Контент --- */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 60px 0 40px;
            animation: fadeInDown 1s ease-out forwards;
        }
        .header-container img { width: 70px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h1 { font-size: 2.5em; font-family: 'Arial Black', sans-serif; margin: 0; }

        .section-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin-bottom: 40px;
        }

        h2 {
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #f1c40f;
            border-bottom: 2px solid rgba(241, 196, 15, 0.4);
            padding-bottom: 10px;
            margin-bottom: 25px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.5s forwards;
        }

        .buttons-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
        }

        .menu-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 280px;
            padding: 24px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            background: var(--btn-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--btn-border);
            border-radius: 22px;
            transition: 0.3s;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .menu-button:hover { transform: translateY(-8px); border-color: #f1c40f; background: rgba(255,255,255,0.2); }

        /* --- Внутренности настроек (ИСПРАВЛЕНО ВИЗУАЛЬНО) --- */
        .settings-footer { 
            margin-top: auto; 
            padding-top: 25px; 
            border-top: 1px solid rgba(255,255,255,0.15); 
        }
        
        .legal-links-settings { 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            margin-bottom: 25px;
        }

        .legal-links-settings a { 
            color: #fff; 
            text-decoration: none; 
            font-size: 14px;
            background: rgba(241, 196, 15, 0.15);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid rgba(241, 196, 15, 0.3);
            transition: 0.3s;
            text-align: center;
        }

        .legal-links-settings a:hover { 
            background: rgba(241, 196, 15, 0.3);
            border-color: #f1c40f;
        }

        .status-badge { 
            display: flex; 
            align-items: center; 
            font-size: 11px; 
            color: #2ecc71; 
            margin-bottom: 15px; 
            letter-spacing: 1px;
            font-weight: bold;
        }

        .status-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; margin-right: 8px; animation: pulseStatus 2s infinite; }
        
        footer { 
            font-size: 11px; 
            color: rgba(255,255,255,0.4); 
            line-height: 1.4;
        }

        /* --- Адаптивность --- */
        @media (max-width: 600px) {
            .settings-trigger span { display: none; }
            .settings-panel { width: 85%; }
            .menu-button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="settings-trigger" onclick="toggleSettings()">
        <svg style="width:22px; height:22px; fill:white;" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span id="trigger-text">Настройки</span>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="setting-item">
            <label>Тема</label>
            <button class="switch-btn" id="lightModeBtn" onclick="setTheme('light')">Светлая</button>
            <button class="switch-btn" id="darkModeBtn" onclick="setTheme('dark')">Темная</button>
        </div>

        <div class="setting-item">
            <label>Фон</label>
            <button class="switch-btn" id="animOnBtn" onclick="setAnim(true)">Живой градиент</button>
            <button class="switch-btn" id="animOffBtn" onclick="setAnim(false)">Статичный</button>
        </div>

        <div class="settings-footer">
            <div class="legal-links-settings">
                <a href="https://mixqzero.github.io/politika" target="_blank">Политика конфиденциальности</a>
                <a href="https://mixqzero.github.io/soglasie" target="_blank">Соглашение пользователя</a>
            </div>
            
            <div class="status-badge">
                <div class="status-dot"></div>
                System Status: Online
            </div>
            
            <footer>
                © 2024-2026 MixQZero<br>
                Core: web4.1
            </footer>
        </div>
    </div>

    <div class="header-container">
        <img src="https://i.postimg.cc/s2yDfZKf/Picsart-25-04-23-11-46-48-965.png" alt="Logo">
        <h1>MixQZero</h1>
    </div>

    <div class="section-wrapper">
        <h2>Мини-проекты</h2>
        <div class="buttons-grid">
            <a href="http://mqz.l.cd/ai" class="menu-button" style="animation-delay: 0.6s;">MixQZero AI в Web-интерфейсе</a>
            <a href="https://mixqzero.github.io/random" class="menu-button" style="animation-delay: 0.7s;">Рандомайзер</a>
            <a href="https://t.me/mixqzeroai_bot" class="menu-button" style="animation-delay: 0.8s;">MixQZero AI в Telegram</a>
        </div>
    </div>

    <div class="section-wrapper">
        <h2>Информация</h2>
        <div class="buttons-grid">
            <a href="https://t.me/mixqzero" class="menu-button" style="animation-delay: 0.9s;">Телеграмм канал</a>
        </div>
    </div>

    <script>
        // Логика сохранения (LocalStorage)
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const savedAnim = localStorage.getItem('anim') === 'false' ? false : true;

            setTheme(savedTheme, false); // false чтобы не сохранять повторно при загрузке
            setAnim(savedAnim, false);
        });

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('active');
        }

        function setTheme(mode, save = true) {
            const body = document.body;
            const lBtn = document.getElementById('lightModeBtn');
            const dBtn = document.getElementById('darkModeBtn');

            if(mode === 'dark') {
                body.classList.add('dark-mode');
                dBtn.classList.add('active');
                lBtn.classList.remove('active');
            } else {
                body.classList.remove('dark-mode');
                lBtn.classList.add('active');
                dBtn.classList.remove('active');
            }
            if(save) localStorage.setItem('theme', mode);
        }

        function setAnim(on, save = true) {
            const body = document.body;
            const onBtn = document.getElementById('animOnBtn');
            const offBtn = document.getElementById('animOffBtn');

            if(on) {
                body.classList.remove('static-bg');
                onBtn.classList.add('active');
                offBtn.classList.remove('active');
            } else {
                body.classList.add('static-bg');
                offBtn.classList.add('active');
                onBtn.classList.remove('active');
            }
            if(save) localStorage.setItem('anim', on);
        }

        // Закрытие панели при клике вне её
        document.addEventListener('mousedown', (e) => {
            const panel = document.getElementById('settingsPanel');
            const trigger = document.querySelector('.settings-trigger');
            if (!panel.contains(e.target) && !trigger.contains(e.target) && panel.classList.contains('active')) {
                panel.classList.remove('active');
            }
        });
    </script>
</body>
</html>
