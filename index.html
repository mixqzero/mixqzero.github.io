<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixQZero - Главная</title>
    <style>
        /* --- Анимации --- */
        @keyframes purpleGoldGradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes backgroundFadeIn {
            from { filter: brightness(0); }
            to { filter: brightness(1); }
        }

        @keyframes pulseStatus {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        /* --- Основные стили --- */
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(-45deg, #8e44ad, #b48a00, #6a1b9a, #c89600);
            background-size: 400% 400%;
            animation: 
                purpleGoldGradientShift 15s ease infinite,
                backgroundFadeIn 2s ease-out forwards; /* Progressive Loading фона */
            overflow-x: hidden;
            color: #f0f0f0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Контентная часть (тянется) --- */
        .main-content {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* --- Заголовок --- */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            margin-bottom: 40px;
            text-align: center;
            animation: fadeInDown 1s ease-out forwards;
        }

        .header-container img {
            width: 65px;
            height: 65px;
            margin-bottom: 15px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            color: #fff;
            margin: 0;
            font-size: 2.5em;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 40px;
            margin-bottom: 20px;
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
            border-bottom: 2px solid rgba(241, 196, 15, 0.5);
            padding-bottom: 8px;
            width: fit-content;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.5s forwards;
        }

        /* --- Меню --- */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
        }

        .menu-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* --- Кнопки (Liquid Glass) --- */
        .menu-button {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 280px;
            padding: 20px 25px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 1.1em;
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(15px) saturate(160%);
            -webkit-backdrop-filter: blur(15px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 4px 4px rgba(255, 255, 255, 0.15);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .btn-1 { animation-delay: 0.6s; }
        .btn-2 { animation-delay: 0.7s; }
        .btn-3 { animation-delay: 0.8s; }
        .btn-4 { animation-delay: 0.9s; }
        .btn-5 { animation-delay: 1.0s; }

        .menu-button::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }

        .menu-button:hover {
            transform: translateY(-7px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 45px rgba(241, 196, 15, 0.25);
            border-color: rgba(241, 196, 15, 0.6);
        }

        .menu-button:active { transform: scale(0.95); }

        .support-text-support {
            font-size: 0.75em;
            color: #f1c40f;
            margin-top: 6px;
            font-weight: normal;
            display: block;
        }

        /* --- Нижняя часть (Status & Footer) --- */
        .bottom-section {
            flex-shrink: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 40px 0 20px 0;
            margin-top: auto;
        }

        /* Статус плашка */
        .status-badge {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            opacity: 0;
            animation: fadeInUp 1s ease-out 1.2s forwards;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulseStatus 2s infinite;
        }

        .legal-links {
            font-size: 13px;
            text-align: center;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 1.4s forwards;
        }

        .legal-links a { 
            color: #f1c40f; 
            text-decoration: none; 
            border-bottom: 1px dashed; 
            margin: 0 10px; 
            transition: 0.3s;
        }

        .legal-links a:hover { color: #fff; }

        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
        }

        .footer-version { color: #f1c40f; opacity: 0.6; display: block; margin-top: 5px; font-weight: bold; }

        @media (max-width: 600px) {
            .menu-button { width: 90%; }
            h1 { font-size: 2em; }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="header-container">
            <img src="https://i.postimg.cc/s2yDfZKf/Picsart-25-04-23-11-46-48-965.png" alt="Логотип MixQZero">
            <h1>MixQZero</h1>
        </div>

        <div class="menu-container">
            <h2>Мини-проекты</h2>
            <div class="menu-row">
                <a href="https://mixqzero.github.io/case" class="menu-button btn-1">Кейс</a>
                <a href="https://mixqzero.github.io/random" class="menu-button btn-2">Рандомайзер</a>
                <a href="https://t.me/mixqzeroai_bot" class="menu-button btn-3">ИИ от MixQZero<span class="support-text-support">Нейросеть</span></a>
            </div>

            <h2>Информация и поддержка</h2>
            <div class="menu-row">
                <a href="https://t.me/mixqzero" class="menu-button btn-4">Телеграмм канал<span class="support-text-support">Новости проекта</span></a>
                <a href="https://t.me/mixqzerobot" class="menu-button btn-5">Телеграмм бот<span class="support-text-support">Техподдержка 24/7</span></a>
            </div>
        </div>
    </div>

    <div class="bottom-section">
        <div class="status-badge">
            <div class="status-dot"></div>
            System Status: Online
        </div>

        <div class="legal-links">
            <a href="https://mixqzero.github.io/politika" target="_blank">Политика конфиденциальности</a> & 
            <a href="https://mixqzero.github.io/soglasie" target="_blank">Соглашение</a>
        </div>

        <footer>
            <p>© 2024-2026 MixQZero. Все права защищены.</p>
            <span class="footer-version">ver. web4Global</span>
        </footer>
    </div>

</body>
</html>
