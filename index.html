<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixQZero - Главная</title>
    <style>
        /* --- Анимации --- */
        @keyframes purpleGoldGradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Основные стили --- */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background: linear-gradient(-45deg, #8e44ad, #b48a00, #6a1b9a, #c89600);
            background-size: 400% 400%;
            animation: purpleGoldGradientShift 15s ease infinite;
            overflow-x: hidden;
            color: #f0f0f0;
            padding: 20px;
            margin: 0;
            box-sizing: border-box;
            position: relative;
            padding-bottom: 120px; /* Увеличили отступ для нижних элементов */
        }

        /* --- Заголовок (Теперь всегда по центру) --- */
        .header-container {
            display: flex;
            flex-direction: column; /* Элементы друг под другом для лучшего центра */
            align-items: center;
            margin-top: 40px;
            margin-bottom: 40px;
            text-align: center;
            animation: fadeInDown 0.8s ease-out forwards;
        }

        .header-container img {
            width: 60px;
            height: 60px;
            margin-bottom: 15px; /* Отступ снизу вместо правого */
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h1 {
            color: #fff;
            margin: 0;
            font-size: 2.2em;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 30px;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.9);
            border-bottom: 2px solid #f1c40f; /* Линия снизу для симметрии по центру */
            padding-bottom: 8px;
            width: fit-content;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.3s forwards;
        }

        /* --- Контейнер меню --- */
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 700px;
        }

        .menu-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* --- Стеклянные Кнопки --- */
        .menu-button {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 280px;
            padding: 18px 25px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 1.1em;
            text-align: center;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(15px) saturate(160%);
            -webkit-backdrop-filter: blur(15px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 4px 4px rgba(255, 255, 255, 0.2);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        /* Задержки анимации */
        .btn-1 { animation-delay: 0.5s; }
        .btn-2 { animation-delay: 0.6s; }
        .btn-3 { animation-delay: 0.7s; }
        .btn-4 { animation-delay: 0.8s; }
        .btn-5 { animation-delay: 0.9s; }

        .menu-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
            pointer-events: none;
        }

        .menu-button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 150%;
            height: 200%;
            background: linear-gradient(115deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: rotate(30deg);
            transition: 0.8s;
        }

        .menu-button:hover {
            transform: translateY(-5px) scale(1.02);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 45px rgba(241, 196, 15, 0.2);
            border-color: rgba(241, 196, 15, 0.5);
        }

        .menu-button:hover::after {
            left: 150%;
        }

        .support-text-support {
            font-size: 0.75em;
            color: #f1c40f;
            margin-top: 5px;
            font-weight: normal;
            display: block;
        }

        /* --- Нижняя часть (Ссылки и Футер) --- */
        .bottom-section {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding-bottom: 20px;
        }

        .legal-links {
            font-size: 13px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 1s forwards;
            text-align: center;
        }
        .legal-links a { color: #f1c40f; text-decoration: none; border-bottom: 1px dashed; margin: 0 5px; }

        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }
        .footer-version { color: #f1c40f; opacity: 0.7; display: block; margin-top: 5px; }

        @media (max-width: 600px) {
            .menu-button { width: 100%; }
            h1 { font-size: 1.8em; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <img src="https://i.postimg.cc/s2yDfZKf/Picsart-25-04-23-11-46-48-965.png" alt="Логотип MixQZero">
        <h1>MixQZero</h1>
    </div>

    <div class="menu-container">

        <h2>Мини-проекты</h2>
        <div class="menu-row">
            <a href="https://mixqzero.github.io/case" class="menu-button btn-1">Кейс</a>
            <a href="https://mixqzero.github.io/random" class="menu-button btn-2">Рандомайзер</a>
            <a href="https://t.me/mixqzeroaibot" class="menu-button btn-3">ИИ от MixQZero<span class="support-text-support">Нейросеть</span></a>
        </div>

        <h2>Информация и поддержка</h2>
        <div class="menu-row">
            <a href="https://t.me/mixqzero" class="menu-button btn-4">Телеграмм канал<span class="support-text-support">Новости проекта</span></a>
            <a href="https://t.me/mixqzerobot" class="menu-button btn-5">Телеграмм бот<span class="support-text-support">Техподдержка 24/7</span></a>
        </div>
    </div>

    <div class="bottom-section">
        <div class="legal-links">
            <a href="https://mixqzero.github.io/politika" target="_blank">Политика конфиденциальности</a> & 
            <a href="https://mixqzero.github.io/soglasie" target="_blank">Соглашение</a>
        </div>

        <footer>
            <p>© 2024-2026 MixQZero. Все права защищены.</p>
            <span class="footer-version">ver. web4Global</span>
        </footer>
    </div>

</body>
</html>
