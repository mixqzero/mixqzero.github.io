<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixQZero - Главная</title>
    <style>
        /* Оригинальные анимации из кода #1 */
        @keyframes purpleGoldGradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(-45deg, #8e44ad, #b48a00, #6a1b9a, #c89600);
            background-size: 400% 400%;
            animation: purpleGoldGradientShift 15s ease infinite;
            overflow-x: hidden;
            color: #ffffff;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Шапка */
        .header-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 60px;
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out forwards;
        }

        .header-container img {
            width: 70px;
            height: auto;
            border-radius: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 2.5em;
            font-family: 'Arial Black', Gadget, sans-serif;
            margin: 0;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Секции */
        .section-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #f1c40f;
            border-bottom: 2px solid rgba(241, 196, 15, 0.4);
            padding-bottom: 8px;
            margin-bottom: 25px;
            opacity: 0;
            animation: fadeInUp 0.8s ease-out 0.5s forwards;
        }

        /* Сетка кнопок */
        .buttons-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            width: 100%;
        }

        .menu-button {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 280px;
            padding: 22px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .menu-button:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.25);
            border-color: #f1c40f;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
        }

        /* Настройки (Оригинальная логика #1) */
        .settings-trigger {
            position: fixed;
            top: 20px;
            right: 20px;
            cursor: pointer;
            z-index: 1001;
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 50%;
            backdrop-filter: blur(10px);
            transition: 0.3s;
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 300px;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            z-index: 1000;
            transform: translateX(110%);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            padding: 80px 25px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .settings-panel.active {
            transform: translateX(0);
        }

        .setting-item {
            margin-bottom: 20px;
        }

        footer {
            margin-top: auto;
            padding: 30px;
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 600px) {
            .menu-button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="settings-trigger" onclick="toggleSettings()">
        <svg style="width:24px;height:24px" viewBox="0 0 24 24">
            <path fill="white" d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.97 19.05,5.05L16.56,6.05C16.04,5.65 15.48,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.52,5.32 7.96,5.65 7.44,6.05L4.95,5.05C4.73,4.97 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.03 4.95,18.95L7.44,17.95C7.96,18.35 8.52,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.48,18.68 16.04,18.35 16.56,17.95L19.05,18.95C19.27,19.03 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z" />
        </svg>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <h3 style="color: #f1c40f; margin-top: 0;">Настройки</h3>
        <div class="setting-item">
            <p>Версия: 1.0.0</p>
            <p>Язык: Русский</p>
        </div>
        <button onclick="toggleSettings()" style="background: #f1c40f; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; width: 100%;">Закрыть</button>
    </div>

    <div class="header-container">
        <img src="https://i.postimg.cc/s2yDfZKf/Picsart-25-04-23-11-46-48-965.png" alt="Logo">
        <h1>MixQZero</h1>
    </div>

    <div class="section-wrapper">
        <h2>Мини-проекты</h2>
        <div class="buttons-grid">
            <a href="https://mixqzero.github.io/case" class="menu-button" style="animation-delay: 0.6s;">
                <span>Кейс</span>
            </a>
            <a href="https://mixqzero.github.io/random" class="menu-button" style="animation-delay: 0.7s;">
                <span>Рандомайзер</span>
            </a>
            <a href="https://t.me/mixqzeroai_bot" class="menu-button" style="animation-delay: 0.8s;">
                <span>ИИ от MixQZero</span>
            </a>
        </div>
    </div>

    <div class="section-wrapper">
        <h2>Информация</h2>
        <div class="buttons-grid">
            <a href="https://t.me/mixqzero" class="menu-button" style="animation-delay: 0.9s;">
                <span>Телеграмм канал</span>
            </a>
            <a href="https://t.me/mixqzerobot" class="menu-button" style="animation-delay: 1.0s;">
                <span>Телеграмм бот</span>
            </a>
        </div>
    </div>

    <footer>
        © 2024-2026 MixQZero. Все права защищены.
    </footer>

    <script>
        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            panel.classList.toggle('active');
        }

        // Закрытие при клике вне панели
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('settingsPanel');
            const trigger = document.querySelector('.settings-trigger');
            if (!panel.contains(e.target) && !trigger.contains(e.target) && panel.classList.contains('active')) {
                panel.classList.remove('active');
            }
        });
    </script>
</body>
</html>
