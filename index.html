<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixQZero - Главная</title>
    <style>
        /* --- Оригинальные анимации из #1 --- */
        @keyframes purpleGoldGradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseStatus {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        /* --- Переменные и темы --- */
        :root {
            --bg-gradient: linear-gradient(-45deg, #8e44ad, #b48a00, #6a1b9a, #c89600);
            --btn-bg: rgba(255, 255, 255, 0.15);
            --btn-border: rgba(255, 255, 255, 0.25);
            --accent: #f1c40f;
        }
        body.dark-mode {
            --bg-gradient: linear-gradient(-45deg, #1a1a1a, #000000, #2c3e50, #000000);
            --btn-bg: rgba(0, 0, 0, 0.4);
            --btn-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: purpleGoldGradientShift 15s ease infinite;
            overflow-x: hidden;
            color: #f0f0f0;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.8s ease;
        }
        body.static-bg { animation: none !important; background-size: cover; }
        body.eco-mode * { transition: none !important; animation: none !important; backdrop-filter: none !important; }

        /* --- Уведомления и Консоль --- */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; }
        .toast { background: rgba(0,0,0,0.8); color: #fff; padding: 12px 20px; border-radius: 10px; margin-top: 10px; backdrop-filter: blur(10px); border-left: 4px solid var(--accent); font-size: 14px; animation: fadeInUp 0.3s ease; }
        #dev-console { position: fixed; top: 80px; left: 20px; width: 280px; max-height: 150px; background: rgba(0,0,0,0.8); font-family: monospace; font-size: 11px; padding: 10px; border-radius: 10px; overflow-y: auto; color: #00ff00; z-index: 999; border: 1px solid rgba(255,255,255,0.1); display: none; }

        /* --- Настройки (Исправлено открытие) --- */
        .settings-trigger { position: fixed; top: 20px; left: 20px; display: flex; align-items: center; gap: 10px; cursor: pointer; z-index: 1001; background: rgba(0, 0, 0, 0.3); padding: 8px 15px; border-radius: 30px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .settings-panel { 
            position: fixed; top: 0; left: -350px; width: 320px; height: 100%; 
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(25px); z-index: 1000; 
            transition: left 0.5s cubic-bezier(0.19, 1, 0.22, 1); 
            padding: 80px 25px 40px; display: flex; flex-direction: column; 
            box-shadow: 20px 0 50px rgba(0,0,0,0.5); overflow-y: auto; 
        }
        .settings-panel.active { left: 0; }

        .setting-item { margin-bottom: 25px; display: flex; flex-direction: column; gap: 8px; }
        .setting-item label { font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        
        .switch-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 12px; border-radius: 12px; cursor: pointer; transition: 0.3s; text-align: left; }
        .switch-btn.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }
        
        select { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px; border-radius: 10px; outline: none; }

        /* --- Контент из #1 --- */
        .header-container { display: flex; flex-direction: column; align-items: center; margin: 60px 0 40px; animation: fadeInDown 1s ease-out forwards; }
        .header-container img { width: 70px; border-radius: 20px; margin-bottom: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h1 { font-size: 2.5em; font-family: 'Arial Black', sans-serif; margin: 0; }
        .section-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 900px; margin-bottom: 30px; }
        h2 { font-size: 1.1em; text-transform: uppercase; letter-spacing: 3px; color: var(--accent); border-bottom: 2px solid rgba(241, 196, 15, 0.4); padding-bottom: 8px; margin-bottom: 25px; opacity: 0; animation: fadeInUp 0.8s ease-out 0.5s forwards; align-self: center; }
        .buttons-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; width: 100%; }

        .menu-button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 280px; padding: 22px; text-decoration: none; color: #fff; font-weight: 600; background: var(--btn-bg); backdrop-filter: blur(15px); border: 1px solid var(--btn-border); border-radius: 22px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; animation: fadeInUp 0.8s ease-out forwards; }
        .menu-button:hover { transform: translateY(-8px); border-color: var(--accent); background: rgba(255,255,255,0.2); }

        .settings-footer { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
        .status-badge { display: flex; align-items: center; font-size: 11px; color: #2ecc71; margin-bottom: 15px; }
        .status-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; margin-right: 8px; animation: pulseStatus 2s infinite; }
        .legal-links-settings { display: flex; flex-direction: column; gap: 12px; font-size: 13px; margin-bottom: 20px; }
        .legal-links-settings a { color: var(--accent); text-decoration: none; opacity: 0.8; }
        footer { font-size: 11px; color: rgba(255,255,255,0.3); line-height: 1.5; }

        @media (max-width: 600px) { .settings-panel { width: 85%; } .menu-button { width: 100%; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>
    <div id="dev-console"></div>

    <div class="settings-trigger" onclick="toggleSettings()">
        <svg style="width:20px; height:20px; fill:white;" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span data-i18n="settings">Настройки</span>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="setting-item">
            <label data-i18n="lang-label">Язык системы</label>
            <select id="langSelect" onchange="changeLang(this.value)">
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="tt">Татарча</option>
            </select>
        </div>

        <div class="setting-item">
            <label data-i18n="theme-label">Визуальная тема</label>
            <div style="display: flex; gap: 5px;">
                <button class="switch-btn active" id="lightModeBtn" onclick="setTheme('light')" style="flex:1">Light</button>
                <button class="switch-btn" id="darkModeBtn" onclick="setTheme('dark')" style="flex:1">Dark</button>
            </div>
        </div>

        <div class="setting-item">
            <label data-i18n="anim-label">Динамика фона</label>
            <div style="display: flex; gap: 5px;">
                <button class="switch-btn active" id="animOnBtn" onclick="setAnim(true)" style="flex:1">ON</button>
                <button class="switch-btn" id="animOffBtn" onclick="setAnim(false)" style="flex:1">OFF</button>
            </div>
        </div>

        <div class="setting-item">
            <label data-i18n="eco-label">Режим экономии</label>
            <button class="switch-btn" id="ecoBtn" onclick="toggleEco()">OFF</button>
        </div>

        <div class="setting-item">
            <label data-i18n="sound-label">Звуковой отклик</label>
            <button class="switch-btn" id="soundBtn" onclick="toggleSound()">OFF</button>
        </div>

        <div class="setting-item">
            <label data-i18n="dev-label">Режим разработчика</label>
            <button class="switch-btn" id="devBtn" onclick="toggleDev()">OFF</button>
        </div>

        <div class="settings-footer">
            <div class="status-badge">
                <div class="status-dot"></div>
                System Status: Online
            </div>
            <div class="legal-links-settings">
                <a href="https://mixqzero.github.io/politika" target="_blank" data-i18n="policy">Политика конфиденциальности</a>
                <a href="https://mixqzero.github.io/soglasie" target="_blank" data-i18n="agreement">Соглашение пользователя</a>
            </div>
            <footer>© 2024-2026 MixQZero<br>Core: web4Global Edition</footer>
        </div>
    </div>

    <div class="header-container">
        <img src="https://i.postimg.cc/s2yDfZKf/Picsart-25-04-23-11-46-48-965.png" alt="Logo">
        <h1>MixQZero</h1>
    </div>

    <div class="section-wrapper">
        <h2 data-i18n="projects-title">Мини-проекты</h2>
        <div class="buttons-grid">
            <a href="https://mixqzero.github.io/case" class="menu-button" style="animation-delay: 0.6s;" data-i18n="btn-case">Кейс</a>
            <a href="https://mixqzero.github.io/random" class="menu-button" style="animation-delay: 0.7s;" data-i18n="btn-random">Рандомайзер</a>
            <a href="https://t.me/mixqzeroai_bot" class="menu-button" style="animation-delay: 0.8s;" data-i18n="btn-ai">ИИ от MixQZero</a>
        </div>
    </div>

    <div class="section-wrapper">
        <h2 data-i18n="info-title">Информация</h2>
        <div class="buttons-grid">
            <a href="https://t.me/mixqzero" class="menu-button" style="animation-delay: 0.9s;" data-i18n="btn-tg">Телеграмм канал</a>
            <a href="https://t.me/mixqzerobot" class="menu-button" style="animation-delay: 1s;" data-i18n="btn-bot">Телеграмм бот</a>
        </div>
    </div>

    <script>
        const i18n = {
            ru: {
                settings: "Настройки", "lang-label": "Язык системы", "theme-label": "Визуальная тема", "anim-label": "Динамика фона", "eco-label": "Режим экономии", "sound-label": "Звуковой отклик", "dev-label": "Режим разработчика", "policy": "Политика конфиденциальности", "agreement": "Соглашение пользователя", "projects-title": "Мини-проекты", "info-title": "Информация", "btn-case": "Кейс", "btn-random": "Рандомайзер", "btn-ai": "ИИ от MixQZero", "btn-tg": "Телеграмм канал", "btn-bot": "Телеграмм бот",
                welcome: "Добро пожаловать!", t_light: "Тема: Светлая", t_dark: "Тема: Темная", anim_on: "Фон: Переливается", anim_off: "Фон: Статичный", dev_on: "Режим разработчика: ВКЛ", dev_off: "Режим разработчика: ВЫКЛ", eco_on: "Экономия: ВКЛ", eco_off: "Экономия: ВЫКЛ"
            },
            en: {
                settings: "Settings", "lang-label": "System Language", "theme-label": "Visual Theme", "anim-label": "Background Flow", "eco-label": "Eco Mode", "sound-label": "Sound Feedback", "dev-label": "Developer Mode", "policy": "Privacy Policy", "agreement": "User Agreement", "projects-title": "Mini Projects", "info-title": "Information", "btn-case": "Case", "btn-random": "Randomizer", "btn-ai": "AI by MixQZero", "btn-tg": "Telegram Channel", "btn-bot": "Telegram Bot",
                welcome: "Welcome!", t_light: "Theme: Light", t_dark: "Theme: Dark", anim_on: "Background: Animated", anim_off: "Background: Static", dev_on: "Dev Mode: ON", dev_off: "Dev Mode: OFF", eco_on: "Eco: ON", eco_off: "Eco: OFF"
            },
            tt: {
                settings: "Көйләүләр", "lang-label": "Система теле", "theme-label": "Визуаль төс", "anim-label": "Фон динамикасы", "eco-label": "Саклау режимы", "sound-label": "Тавыш җавабы", "dev-label": "Разработчик режимы", "policy": "Конфиденциальлек политикасы", "agreement": "Кулланучы килешүе", "projects-title": "Мини-проектлар", "info-title": "Мәгълүмат", "btn-case": "Кейс", "btn-random": "Рандомайзер", "btn-ai": "MixQZero-дан ИИ", "btn-tg": "Телеграмм канал", "btn-bot": "Телеграмм бот",
                welcome: "Рәхим итегез!", t_light: "Төс: Якты", t_dark: "Төс: Караңгы", anim_on: "Фон: Хәрәкәтле", anim_off: "Фон: Статик", dev_on: "Разработчик: КАБЫЗЫЛДЫ", dev_off: "Разработчик: СҮНДЕ", eco_on: "Саклау: КАБЫЗЫЛДЫ", eco_off: "Саклау: СҮНДЕ"
            }
        };

        let currentLang = 'ru';
        const clickSound = new Audio('https://www.soundjay.com/buttons/button-50.mp3');
        let isSound = false;
        let isDev = false;
        let isEco = false;

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 3000);
            if(isDev) addLog(msg);
        }

        function addLog(msg) {
            const consoleBox = document.getElementById('dev-console');
            const entry = document.createElement('div');
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            consoleBox.appendChild(entry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('active');
            playClick();
        }

        function playClick() { if(isSound) clickSound.play(); }

        function setTheme(mode) {
            const body = document.body;
            const lBtn = document.getElementById('lightModeBtn');
            const dBtn = document.getElementById('darkModeBtn');
            if(mode === 'dark') {
                body.classList.add('dark-mode');
                dBtn.classList.add('active'); lBtn.classList.remove('active');
                showToast(i18n[currentLang].t_dark);
            } else {
                body.classList.remove('dark-mode');
                lBtn.classList.add('active'); dBtn.classList.remove('active');
                showToast(i18n[currentLang].t_light);
            }
            playClick();
        }

        function setAnim(on) {
            const body = document.body;
            const onBtn = document.getElementById('animOnBtn');
            const offBtn = document.getElementById('animOffBtn');
            if(on) {
                body.classList.remove('static-bg');
                onBtn.classList.add('active'); offBtn.classList.remove('active');
                showToast(i18n[currentLang].anim_on);
            } else {
                body.classList.add('static-bg');
                offBtn.classList.add('active'); onBtn.classList.remove('active');
                showToast(i18n[currentLang].anim_off);
            }
            playClick();
        }

        function toggleEco() {
            isEco = !isEco;
            document.body.classList.toggle('eco-mode', isEco);
            document.getElementById('ecoBtn').innerText = isEco ? "ON" : "OFF";
            document.getElementById('ecoBtn').classList.toggle('active', isEco);
            showToast(isEco ? i18n[currentLang].eco_on : i18n[currentLang].eco_off);
            playClick();
        }

        function toggleSound() {
            isSound = !isSound;
            document.getElementById('soundBtn').innerText = isSound ? "ON" : "OFF";
            document.getElementById('soundBtn').classList.toggle('active', isSound);
            playClick();
        }

        function toggleDev() {
            isDev = !isDev;
            document.getElementById('dev-console').style.display = isDev ? 'block' : 'none';
            document.getElementById('devBtn').innerText = isDev ? "ON" : "OFF";
            document.getElementById('devBtn').classList.toggle('active', isDev);
            showToast(isDev ? i18n[currentLang].dev_on : i18n[currentLang].dev_off);
            playClick();
        }

        function changeLang(v) {
            currentLang = v;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.innerText = i18n[v][el.getAttribute('data-i18n')];
            });
            showToast("Language: " + v.toUpperCase());
            playClick();
        }

        document.addEventListener('click', (e) => {
            const panel = document.getElementById('settingsPanel');
            const trigger = document.querySelector('.settings-trigger');
            if (!panel.contains(e.target) && !trigger.contains(e.target) && panel.classList.contains('active')) {
                panel.classList.remove('active');
            }
        });

        window.onload = () => {
            showToast(i18n[currentLang].welcome);
            document.querySelectorAll('a').forEach(a => a.addEventListener('click', playClick));
        };
    </script>
</body>
</html>
