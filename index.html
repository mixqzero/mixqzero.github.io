<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixQZero - Hub</title>
    <style>
        /* --- Анимации --- */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseStatus {
            0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); }
            100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        /* --- Переменные и Темы --- */
        :root {
            --bg: linear-gradient(-45deg, #8e44ad, #b48a00, #6a1b9a, #c89600);
            --btn-bg: rgba(255, 255, 255, 0.15);
            --btn-border: rgba(255, 255, 255, 0.25);
            --text: #ffffff;
            --accent: #f1c40f;
            --glass-opacity: 0.15;
            --font-main: 'Segoe UI', sans-serif;
        }

        /* Классы тем */
        body.theme-dark-red { --bg: linear-gradient(-45deg, #4b0000, #900000, #2b0000); }
        body.theme-dark-blue { --bg: linear-gradient(-45deg, #001f3f, #003366, #000c1a); }
        body.theme-dark-green { --bg: linear-gradient(-45deg, #002b11, #004d20, #001107); }
        body.theme-off-white { --bg: #d0d0d0; --text: #333; --btn-bg: rgba(0,0,0,0.1); }
        body.theme-pearl { --bg: linear-gradient(135deg, #ffffff, #dcdcdc, #b0b0b0); --text: #222; }
        body.theme-amoled { --bg: #000000; }
        body.theme-dark { --bg: #121212; }

        /* Шрифты */
        body.font-mono { --font-main: 'Courier New', monospace; }
        body.font-cyber { --font-main: 'Impact', sans-serif; letter-spacing: 1px; }

        body {
            font-family: var(--font-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: var(--bg);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: var(--text);
            padding: 20px;
            box-sizing: border-box;
            transition: all 0.5s ease;
        }

        body.eco-mode { animation: none !important; }
        body.eco-mode * { transition: none !important; backdrop-filter: none !important; }

        /* --- Уведомления --- */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 10000; }
        .toast { 
            background: rgba(0,0,0,0.8); color: #fff; padding: 12px 20px; border-radius: 10px; 
            margin-top: 10px; backdrop-filter: blur(10px); border-left: 4px solid var(--accent);
            font-size: 14px; animation: fadeInUp 0.3s ease;
        }

        /* --- Консоль --- */
        #dev-console {
            position: fixed; top: 10px; right: 10px; width: 250px; max-height: 200px;
            background: rgba(0,0,0,0.85); font-family: monospace; font-size: 10px;
            padding: 10px; border-radius: 8px; overflow-y: auto; color: #00ff00;
            z-index: 9999; border: 1px solid #333; display: none;
        }

        /* --- Настройки --- */
        .settings-trigger {
            position: fixed; top: 20px; left: 20px; display: flex; align-items: center; gap: 10px;
            cursor: pointer; z-index: 1001; background: rgba(0, 0, 0, 0.4);
            padding: 8px 15px; border-radius: 30px; backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .settings-panel {
            position: fixed; top: 0; left: -350px; width: 300px; height: 100%;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px);
            z-index: 1000; transition: 0.4s; padding: 70px 25px 40px;
            overflow-y: auto; box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        .settings-panel.active { left: 0; }

        .setting-item { margin-bottom: 20px; }
        .setting-item label { display: block; font-size: 11px; color: var(--accent); text-transform: uppercase; margin-bottom: 8px; }
        
        select, input[type="range"] {
            width: 100%; padding: 8px; background: rgba(255,255,255,0.1);
            border: 1px solid #444; color: #fff; border-radius: 5px;
        }

        /* --- Карточки --- */
        .menu-button {
            position: relative; width: 280px; padding: 25px; margin: 10px;
            text-decoration: none; color: inherit; background: var(--btn-bg);
            border: 1px solid var(--btn-border); border-radius: 22px;
            backdrop-filter: blur(15px); transition: 0.3s;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        /* Эффект инея */
        .frost::after {
            content: ""; position: absolute; inset: 0;
            background: url('https://www.transparenttextures.com/patterns/ice-age.png');
            opacity: 0.1; pointer-events: none;
        }

        .menu-button:hover { transform: scale(1.05); border-color: var(--accent); }

        .status-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; display: inline-block; margin-right: 8px; animation: pulseStatus 2s infinite; }
    </style>
</head>
<body id="mainBody">

    <div id="toast-container"></div>
    
    <div id="dev-console"></div>

    <div class="settings-trigger" onclick="toggleSettings()">
        <span>⚙️</span> <span data-i18n="settings">Настройки</span>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="setting-item">
            <label data-i18n="language">Язык</label>
            <select id="langSelect" onchange="changeLang(this.value)">
                <option value="ru">Русский</option>
                <option value="en">English</option>
                <option value="tt">Татарча</option>
            </select>
        </div>

        <div class="setting-item">
            <label data-i18n="theme">Тема</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="default">Стандарт (Золото)</option>
                <option value="dark">Тёмная</option>
                <option value="dark-red">Тёмно-красная</option>
                <option value="dark-blue">Тёмно-синяя</option>
                <option value="dark-green">Тёмно-зелёная</option>
                <option value="off-white">Тёмно-белая</option>
                <option value="pearl">Жемчужная</option>
                <option value="amoled">Чисто чёрная</option>
            </select>
        </div>

        <div class="setting-item">
            <label data-i18n="font">Шрифт</label>
            <select onchange="changeFont(this.value)">
                <option value="std">Segoe UI</option>
                <option value="mono">Monospace</option>
                <option value="cyber">Cyberpunk</option>
            </select>
        </div>

        <div class="setting-item">
            <label data-i18n="opacity">Прозрачность кнопок</label>
            <input type="range" min="0" max="1" step="0.1" oninput="changeOpacity(this.value)">
        </div>

        <div class="setting-item">
            <label><input type="checkbox" id="ecoToggle" onchange="toggleEco(this.checked)"> <span data-i18n="eco">Экономия ресурсов</span></label>
        </div>

        <div class="setting-item">
            <label><input type="checkbox" id="soundToggle"> <span data-i18n="sound">Звуковой отклик</span></label>
        </div>

        <div class="setting-item">
            <label><input type="checkbox" id="devToggle" onchange="toggleDev(this.checked)"> <span data-i18n="dev">Режим разработчика</span></label>
        </div>

        <div style="margin-top: 30px; font-size: 12px; opacity: 0.6;">
            <div class="status-dot"></div> System Online
            <br><br>
            <a href="https://mixqzero.github.io/politika" style="color:var(--accent)">Privacy Policy</a>
        </div>
    </div>

    <div style="text-align: center; margin-top: 50px;">
        <img src="https://i.postimg.cc/s2yDfZKf/Picsart-25-04-23-11-46-48-965.png" width="80" style="border-radius: 20px;">
        <h1>MixQZero</h1>
    </div>

    <h2 data-i18n="projects" style="color:var(--accent); text-transform: uppercase; font-size: 14px; margin-top: 40px;">Мини-проекты</h2>
    
    <div style="display: flex; flex-wrap: wrap; justify-content: center;">
        <a href="#" class="menu-button live-card frost">Кейс</a>
        <a href="#" class="menu-button live-card frost">Рандомайзер</a>
        <a href="https://t.me/mixqzeroai_bot" class="menu-button live-card frost">ИИ от MixQZero</a>
    </div>

    <script>
        // --- ДАННЫЕ ---
        const i18n = {
            ru: { settings: "Настройки", language: "Язык", theme: "Тема", font: "Шрифт", opacity: "Прозрачность", eco: "Экономия ресурсов", sound: "Звук", dev: "Режим разработчика", projects: "Мини-проекты", welcome: "Добро пожаловать!", t_changed: "Тема изменена", dev_on: "Режим разработчика включен", eco_on: "Экономия ресурсов: ВКЛ" },
            en: { settings: "Settings", language: "Language", theme: "Theme", font: "Font", opacity: "Opacity", eco: "Eco Mode", sound: "Sound", dev: "Dev Mode", projects: "Projects", welcome: "Welcome!", t_changed: "Theme updated", dev_on: "Dev Mode enabled", eco_on: "Eco Mode: ON" },
            tt: { settings: "Көйләүләр", language: "Тел", theme: "Төс", font: "Шрифт", opacity: "Үтә күренмәлелек", eco: "Ресурсларны саклау", sound: "Тавыш", dev: "Разработчик режимы", projects: "Проектлар", welcome: "Рәхим итегез!", t_changed: "Төс үзгәртелде", dev_on: "Режим кабызылды", eco_on: "Саклау режимы: ВКЛ" }
        };

        let currentLang = localStorage.getItem('lang') || 'ru';
        const clickSound = new Audio('https://www.soundjay.com/buttons/button-50.mp3');

        // --- ФУНКЦИИ ---
        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 3000);
            addLog(msg);
        }

        function addLog(msg) {
            const consoleBox = document.getElementById('dev-console');
            const entry = document.createElement('div');
            entry.innerText = `> ${msg}`;
            consoleBox.appendChild(entry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('active');
            playClick();
        }

        function playClick() {
            if(document.getElementById('soundToggle').checked) clickSound.play();
        }

        function changeTheme(v) {
            const b = document.body;
            b.className = v === 'default' ? '' : 'theme-' + v;
            showToast(i18n[currentLang].t_changed);
            localStorage.setItem('theme', v);
        }

        function changeLang(v) {
            currentLang = v;
            localStorage.setItem('lang', v);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.innerText = i18n[v][el.getAttribute('data-i18n')];
            });
            showToast("Language: " + v.toUpperCase());
        }

        function changeFont(v) {
            document.body.classList.remove('font-mono', 'font-cyber');
            if(v !== 'std') document.body.classList.add('font-' + v);
            showToast("Font changed");
        }

        function changeOpacity(v) {
            document.documentElement.style.setProperty('--btn-bg', `rgba(255,255,255,${v/2})`);
            document.documentElement.style.setProperty('--btn-border', `rgba(255,255,255,${v})`);
        }

        function toggleEco(v) {
            document.body.classList.toggle('eco-mode', v);
            if(v) showToast(i18n[currentLang].eco_on);
        }

        function toggleDev(v) {
            document.getElementById('dev-console').style.display = v ? 'block' : 'none';
            if(v) showToast(i18n[currentLang].dev_on);
        }

        // Живые карточки
        document.addEventListener('mousemove', e => {
            if(document.body.classList.contains('eco-mode')) return;
            document.querySelectorAll('.live-card').forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width - 0.5;
                const y = (e.clientY - rect.top) / rect.height - 0.5;
                card.style.transform = `perspective(1000px) rotateX(${y * 10}deg) rotateY(${x * -10}deg) scale(1.02)`;
            });
        });

        // Инициализация
        window.onload = () => {
            changeLang(currentLang);
            document.getElementById('langSelect').value = currentLang;
            showToast(i18n[currentLang].welcome);
            
            document.querySelectorAll('button, a, .settings-trigger').forEach(el => {
                el.addEventListener('click', playClick);
            });
        };
    </script>
</body>
</html>
