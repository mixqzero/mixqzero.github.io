<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MixQZero - Главная</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(-45deg, #12002b, #2a0845, #6a1b9a, #11001c);
            --btn-bg: rgba(255, 255, 255, 0.07);
            --btn-border: rgba(255, 255, 255, 0.18);
            --glow-color: rgba(241, 196, 15, 0.3);
            --accent-solid: #f1c40f;
            --text-main: #f0f0f0;
            --panel-bg: rgba(10, 5, 20, 0.95);
        }

        body.dark-mode {
            --bg-gradient: linear-gradient(-45deg, #050508, #0a0a12, #1a1a2e, #020205);
            --btn-bg: rgba(0, 0, 0, 0.5);
            --btn-border: rgba(255, 255, 255, 0.08);
            --glow-color: rgba(142, 68, 173, 0.3);
            --accent-solid: #8e44ad;
            --panel-bg: rgba(5, 2, 10, 0.98);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0;
            background: var(--bg-gradient); background-size: 400% 400%;
            animation: purpleGoldGradientShift 15s ease infinite; overflow-x: hidden;
            color: var(--text-main); padding: 20px; box-sizing: border-box;
            transition: background 0.8s ease; position: relative; cursor: default;
        }
        body.static-bg { animation: none !important; background-size: cover; }

        #space-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1; }
        #distortion-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2; backdrop-filter: blur(0px); transition: backdrop-filter 0.3s; }
        .settings-trigger, .settings-panel, .header-container, .section-wrapper { z-index: 10; position: relative; }

        @keyframes purpleGoldGradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseStatus { 0% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); } 70% { box-shadow: 0 0 0 8px rgba(46, 204, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); } }
        @keyframes floatLogo { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        @keyframes textShimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes glitch-skew { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); filter: hue-rotate(90deg); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); filter: hue-rotate(-90deg); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
        @keyframes liquidBorder { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }

        .settings-trigger { position: fixed; top: 20px; left: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; z-index: 1100; background: rgba(0, 0, 0, 0.4); padding: 12px; border-radius: 50px; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); transition: 0.3s; min-width: 44px; min-height: 44px; }
        .settings-trigger:hover { box-shadow: 0 0 20px var(--glow-color); border-color: var(--accent-solid); }
        .settings-panel { position: fixed; top: 0; left: 0; width: 300px; height: 100%; background: var(--panel-bg); backdrop-filter: blur(25px); z-index: 1050; transform: translateX(-101%); transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1); padding: 80px 25px 40px; display: flex; flex-direction: column; box-shadow: 10px 0 50px rgba(0,0,0,0.8); box-sizing: border-box; border-right: 1px solid rgba(255, 255, 255, 0.1); }
        .settings-panel.active { transform: translateX(0); }
        .setting-item { margin-bottom: 25px; display: flex; flex-direction: column; gap: 10px; }
        .setting-item label { font-size: 12px; color: var(--accent-solid); text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.8; }
        .switch-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 12px; border-radius: 12px; cursor: pointer; transition: 0.2s; text-align: left; }
        .switch-btn.active { background: var(--accent-solid); color: #000; font-weight: bold; border-color: var(--accent-solid); box-shadow: 0 0 15px var(--glow-color); }

        .header-container { display: flex; flex-direction: column; align-items: center; margin: 60px 0 30px; animation: fadeInDown 1s ease-out forwards; }
        .header-container img { width: 80px; border-radius: 22px; margin-bottom: 15px; box-shadow: 0 0 30px var(--glow-color); animation: floatLogo 4s ease-in-out infinite; }
        h1 { font-size: 2.8em; font-family: 'Arial Black', sans-serif; margin: 0; background: linear-gradient(90deg, #ffffff 0%, var(--accent-solid) 50%, #ffffff 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 10px var(--accent-solid)); animation: textShimmer 4s linear infinite; }

        .section-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 900px; margin-bottom: 40px; }
        h2 { font-size: 1.1em; text-transform: uppercase; letter-spacing: 3px; color: var(--accent-solid); border-bottom: 2px solid rgba(241, 196, 15, 0.4); padding-bottom: 10px; margin-bottom: 25px; opacity: 0; animation: fadeInUp 0.8s ease-out 0.5s forwards; text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        .buttons-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; width: 100%; perspective: 1000px; }
        .menu-button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 280px; padding: 24px; text-decoration: none; color: #fff; font-weight: 600; background: var(--btn-bg); backdrop-filter: blur(15px); border: 1px solid var(--btn-border); border-radius: 22px; cursor: pointer; opacity: 0; overflow: hidden; transition: transform 0.2s ease-out, border-color 0.3s, box-shadow 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .menu-button::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 22px; padding: 2px; background: linear-gradient(90deg, transparent, var(--accent-solid), transparent, var(--accent-solid), transparent); background-size: 300% 100%; -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0); -webkit-mask-composite: destination-out; mask-composite: exclude; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
        .menu-button:hover { border-color: transparent; box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px var(--glow-color); }
        .menu-button:hover::after { opacity: 1; animation: liquidBorder 2s linear infinite; }
        .menu-button:active { transform: translateY(2px) scale(0.98); box-shadow: 0 5px 10px rgba(0,0,0,0.4); transition: transform 0.1s; }

        .settings-footer { margin-top: auto; padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.15); }
        .status-badge { display: flex; align-items: center; font-size: 11px; color: #2ecc71; margin-bottom: 15px; letter-spacing: 1px; font-weight: bold; }
        .status-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; margin-right: 8px; animation: pulseStatus 2s infinite; }
        footer { font-size: 11px; color: rgba(255,255,255,0.4); line-height: 1.4; }

        @media (max-width: 600px) {
            .settings-trigger span { display: none; }
            .settings-panel { width: 85%; }
            .menu-button { width: 100%; }
        }

        #preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050508; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.6s ease, visibility 0.6s; }
        .loader-ring { width: 60px; height: 60px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent-solid); border-radius: 50%; animation: spin 1s linear infinite; }
        #preloader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .glitch-hover { position: relative; display: inline-block; }
        .glitch-hover:hover { animation: glitch-skew 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite; color: var(--accent-solid); }
        .menu-button .spotlight { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.15), transparent 60%); opacity: 0; transition: opacity 0.3s; pointer-events: none; border-radius: 22px; z-index: 1; }
        .menu-button:hover .spotlight { opacity: 1; }
        .menu-button span, .menu-button { z-index: 2; position: relative; }
    </style>
</head>
<body>

    <div id="preloader"><div class="loader-ring"></div></div>
    <canvas id="space-canvas"></canvas>
    <div id="distortion-layer"></div>

    <div class="settings-trigger" onclick="toggleSettings();">
        <svg style="width:22px; height:22px; fill:white;" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        <span id="trigger-text">Настройки</span>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="setting-item">
            <label>Тема</label>
            <button class="switch-btn" id="lightModeBtn" onclick="setTheme('light');">Светлая</button>
            <button class="switch-btn" id="darkModeBtn" onclick="setTheme('dark');">Темная</button>
        </div>
        <div class="setting-item">
            <label>Фон</label>
            <button class="switch-btn" id="animOnBtn" onclick="setAnim(true);">Живой градиент</button>
            <button class="switch-btn" id="animOffBtn" onclick="setAnim(false);">Статичный</button>
        </div>
        <div class="settings-footer">
            <div class="status-badge">
                <div class="status-dot"></div>
                System Status: Online
            </div>
            <footer>© 2024-2026 MixQZero<br>Core: web4.1</footer>
        </div>
    </div>

    <div class="header-container" id="parallax-header">
        <img src="https://i.postimg.cc/s2yDfZKf/Picsart-25-04-23-11-46-48-965.png" alt="Logo">
        <h1 class="glitch-hover">MixQZero</h1>
    </div>

    <div class="section-wrapper">
        <h2>Нейросеть</h2>
        <div class="buttons-grid">
            <a href="http://mqz.l.cd/ai" class="menu-button"><div class="spotlight"></div>MixQZero AI в Web</a>
            <a href="https://t.me/mixqzeroai_bot" class="menu-button"><div class="spotlight"></div>MixQZero AI в Telegram</a>
        </div>
    </div>

    <div class="section-wrapper">
        <h2>Мини-проекты</h2>
        <div class="buttons-grid">
            <a href="https://mixqzero.github.io/random" class="menu-button"><div class="spotlight"></div>Рандомайзер</a>
        </div>
    </div>

    <div class="section-wrapper">
        <h2>Информация</h2>
        <div class="buttons-grid" id="info-grid">
            <a href="https://t.me/mixqzero" class="menu-button"><div class="spotlight"></div>Телеграмм канал</a>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => { document.getElementById('preloader').classList.add('hidden'); }, 600);
        });

        document.querySelectorAll('.menu-button').forEach(btn => {
            btn.addEventListener('mousemove', (e) => {
                const rect = btn.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                const spotlight = btn.querySelector('.spotlight');
                if (spotlight) { spotlight.style.setProperty('--x', `${x}%`); spotlight.style.setProperty('--y', `${y}%`); }
            });
        });

        const parallaxHeader = document.getElementById('parallax-header');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 90;
            const y = (window.innerHeight - e.pageY * 2) / 90;
            if (parallaxHeader) parallaxHeader.style.transform = `translate(${x}px, ${y}px)`;
        });

        document.addEventListener('DOMContentLoaded', () => {
            setTheme(localStorage.getItem('theme') || 'light', false);
            setAnim(localStorage.getItem('anim') !== 'false', false);
            startStaggeredAnimation();
        });

        function toggleSettings() {
            const panel = document.getElementById('settingsPanel');
            const dl = document.getElementById('distortion-layer');
            panel.classList.toggle('active');
            dl.style.backdropFilter = panel.classList.contains('active') ? 'blur(10px) saturate(50%)' : 'blur(0px) saturate(100%)';
        }

        function setTheme(mode, save = true) {
            const b = document.body, l = document.getElementById('lightModeBtn'), d = document.getElementById('darkModeBtn');
            if (mode === 'dark') { b.classList.add('dark-mode'); d.classList.add('active'); l.classList.remove('active'); }
            else { b.classList.remove('dark-mode'); l.classList.add('active'); d.classList.remove('active'); }
            if (save) localStorage.setItem('theme', mode);
        }

        function setAnim(on, save = true) {
            const b = document.body, o = document.getElementById('animOnBtn'), f = document.getElementById('animOffBtn');
            if (on) { b.classList.remove('static-bg'); o.classList.add('active'); f.classList.remove('active'); }
            else { b.classList.add('static-bg'); f.classList.add('active'); o.classList.remove('active'); }
            if (save) localStorage.setItem('anim', on);
        }

        document.addEventListener('mousedown', (e) => {
            const p = document.getElementById('settingsPanel'), t = document.querySelector('.settings-trigger');
            if (!p.contains(e.target) && !t.contains(e.target) && p.classList.contains('active')) toggleSettings();
        });

        function startStaggeredAnimation() {
            document.querySelectorAll('.menu-button').forEach((btn, i) => {
                btn.style.animation = `fadeInUp 0.6s ease-out forwards`;
                btn.style.animationDelay = `${(i + 3) * 0.1}s`;
            });
        }

        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');
        const distortionLayer = document.getElementById('distortion-layer');
        let width = canvas.width = window.innerWidth, height = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

        const stars = [], numStars = 100;
        class Star {
            constructor() { this.reset(); }
            reset() { this.x = Math.random()*width; this.y = Math.random()*height; this.size = Math.random()*2+0.5; this.speedX = (Math.random()-0.5)*0.1; this.speedY = (Math.random()-0.5)*0.1; this.alpha = Math.random()*0.8+0.2; }
            update() { this.x += this.speedX; this.y += this.speedY; if(this.x<0)this.x=width; if(this.x>width)this.x=0; if(this.y<0)this.y=height; if(this.y>height)this.y=0; }
            draw() { ctx.fillStyle=`rgba(255,255,255,${this.alpha})`; ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); }
        }

        const meteors = [], numMeteors = 5;
        class Meteor {
            constructor() { this.reset(); }
            reset() { this.x=Math.random()*width*1.5; this.y=Math.random()*-height; this.size=Math.random()+0.5; this.length=Math.random()*80+20; this.speedX=(Math.random()*-10)-5; this.speedY=(Math.random()*10)+5; this.alpha=Math.random()*0.5+0.3; this.active=false; }
            update() { if(!this.active)return; this.x+=this.speedX; this.y+=this.speedY; if(this.y>height||this.x<-this.length){this.reset();this.active=false;} }
            draw() { if(!this.active)return; ctx.strokeStyle=`rgba(255,255,255,${this.alpha})`; ctx.lineWidth=this.size; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(this.x,this.y); ctx.lineTo(this.x-this.speedX*(this.length/10),this.y-this.speedY*(this.length/10)); ctx.stroke(); }
        }

        for(let i=0;i<numStars;i++) stars.push(new Star());
        for(let i=0;i<numMeteors;i++) meteors.push(new Meteor());
        function triggerRandomMeteor() { const m=meteors.find(m=>!m.active); if(m)m.active=true; setTimeout(triggerRandomMeteor,Math.random()*5000+2000); }
        triggerRandomMeteor();
        function animateSpace() { ctx.clearRect(0,0,width,height); stars.forEach(s=>{s.update();s.draw();}); meteors.forEach(m=>{m.update();m.draw();}); requestAnimationFrame(animateSpace); }
        animateSpace();

        document.querySelectorAll('.menu-button').forEach(btn => {
            btn.addEventListener('mousemove', () => { distortionLayer.style.backdropFilter = 'blur(4px)'; });
            btn.addEventListener('mouseleave', () => { distortionLayer.style.backdropFilter = 'blur(0px)'; });
        });
    </script>
</body>
</html>
